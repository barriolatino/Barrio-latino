# Styles de sous-titres (rendus avec libass).
# size : hauteur de police en fraction de la hauteur d'image.
# max_chars : caractères maximum par ligne ; max_lines : lignes par sous-titre.
# position : "bas" ou "centre-bas" (au-dessus de la zone d'interface des plateformes).
# Polices : DejaVu Sans (licence Bitstream Vera/libre) et Liberation Sans (SIL OFL),
# installées sur le système. Toute autre police doit être déposée dans
# assets/fonts/ avec sa licence.

[sobre]
label = "Sobre et professionnel"
font = "DejaVu Sans"
bold = false
size = 0.042
color = "FFFFFF"
outline_color = "000000"
outline = 0.0022
shadow = 0.0
box = false
max_chars = 42
max_lines = 2
position = "bas"
uppercase = false

