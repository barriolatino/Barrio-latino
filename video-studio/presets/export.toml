# Presets d'export. Chaque section est un format de sortie.
# fps = 0 : conserver la cadence source (arrondie à une cadence standard, 60 max).
# safe_* : marges de sécurité (fraction de l'image) où aucun texte ne doit tomber,
# pour ne pas être masqué par l'interface de la plateforme.
# loudness : intensité intégrée visée en LUFS ; true_peak : crête vraie maximale en dBTP.

[tiktok]
label = "TikTok vertical"
width = 1080
height = 1920
fps = 30
crf = 20
x264_preset = "medium"
maxrate = "10M"
audio_bitrate = "192k"
loudness = -14.0
true_peak = -1.5
max_duration = 600
safe_top = 0.10
safe_bottom = 0.22
safe_left = 0.06
safe_right = 0.14
subtitle_style = "dynamique"

