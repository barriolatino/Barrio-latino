# Profils colorimétriques. Ce sont des corrections automatiques simples
# (filtres FFmpeg eq, colortemperature, colorbalance), pas un étalonnage
# professionnel plan par plan. Les valeurs restent volontairement modérées.
#
# contrast/brightness/saturation/gamma : paramètres du filtre eq (1.0 / 0.0 = neutre)
# temperature : température cible en kelvins (6500 = neutre), mix = intensité 0..1
# shadows_* / highlights_* : colorbalance (-1..1), décalage des ombres / hautes lumières

[naturel]
label = "Naturel"
contrast = 1.02
saturation = 1.0
brightness = 0.0
gamma = 1.0
temperature = 6500
temperature_mix = 0.0

[commercial]
label = "Commercial (net, propre)"
