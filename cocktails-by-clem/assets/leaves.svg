<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Ombres de feuillage : la matiere signature du compte @cocktailsbyclem_.
       Le flou est cuit dans le fichier (feGaussianBlur) pour que la page n'ait
       aucun filtre CSS a recalculer au scroll. -->
  <defs>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7.5"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <g id="leaf">
      <path d="M0 0C16-25 54-33 82-11 54 13 16 21 0 0Z"/>
    </g>
    <g id="branch">
      <path d="M0 0C70-14 150-20 232-12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(16 -3) rotate(-38) scale(.82)"/>
      <use href="#leaf" transform="translate(30 2) rotate(36) scale(.74)"/>
      <use href="#leaf" transform="translate(74 -9) rotate(-44) scale(.95)"/>
      <use href="#leaf" transform="translate(86 -2) rotate(32) scale(.86)"/>
      <use href="#leaf" transform="translate(134 -14) rotate(-35) scale(1.02)"/>
      <use href="#leaf" transform="translate(144 -6) rotate(40) scale(.9)"/>
      <use href="#leaf" transform="translate(190 -16) rotate(-30) scale(.84)"/>
      <use href="#leaf" transform="translate(198 -9) rotate(34) scale(.72)"/>
    </g>
    <g id="frond">
      <path d="M0 0C58-40 140-64 226-58" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(22 -16) rotate(-66) scale(1.5)"/>
      <use href="#leaf" transform="translate(34 -12) rotate(-6) scale(1.35)"/>
      <use href="#leaf" transform="translate(74 -34) rotate(-70) scale(1.7)"/>
      <use href="#leaf" transform="translate(88 -28) rotate(-2) scale(1.5)"/>
      <use href="#leaf" transform="translate(136 -50) rotate(-74) scale(1.6)"/>
      <use href="#leaf" transform="translate(150 -44) rotate(4) scale(1.4)"/>
      <use href="#leaf" transform="translate(190 -58) rotate(-78) scale(1.25)"/>
      <use href="#leaf" transform="translate(200 -52) rotate(8) scale(1.1)"/>
    </g>
  </defs>

  <g fill="#1B3B24" color="#1B3B24">
    <g filter="url(#softer)" opacity=".30">
      <use href="#frond"  transform="translate(-60 250) rotate(14) scale(1.9)"/>
      <use href="#branch" transform="translate(880 -30) rotate(104) scale(2.1)"/>
    </g>
    <g filter="url(#soft)" opacity=".42">
      <use href="#branch" transform="translate(1035 90) rotate(126) scale(1.45)"/>
      <use href="#frond"  transform="translate(150 815) rotate(-40) scale(1.25)"/>
      <use href="#branch" transform="translate(690 700) rotate(-18) scale(1.1)"/>
    </g>
    <g filter="url(#soft)" opacity=".26">
      <use href="#leaf" transform="translate(430 120) rotate(22) scale(2.3)"/>
      <use href="#leaf" transform="translate(300 330) rotate(-54) scale(1.7)"/>
      <use href="#leaf" transform="translate(1000 520) rotate(148) scale(2.05)"/>
      <use href="#leaf" transform="translate(560 560) rotate(96) scale(1.5)"/>
    </g>
  </g>
</svg>
