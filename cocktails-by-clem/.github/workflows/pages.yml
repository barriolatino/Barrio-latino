# Publie le site sur GitHub Pages à chaque push sur main.
#
# Ce fichier n'a d'effet que lorsque ce dossier est la racine d'un dépôt :
# GitHub ne lit les workflows que dans `.github/workflows/` à la racine. Tant
# que le site vit dans un sous-dossier de Barrio-latino, il reste inerte.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` active GitHub Pages si ce n'est pas déjà fait :
      # aucun passage par Settings n'est nécessaire.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
